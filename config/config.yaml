# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件 (炒股决策定制版)
#                      Version: 2.4.0
# ═══════════════════════════════════════════════════════════════

# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"            # 锁定北京时间（A股交易时间基准）
  show_version_update: true

# ===============================================================
# 1.5 调度系统 —— 贴合A股交易作息
# ===============================================================
schedule:
  enabled: true                        # 启用调度：按交易时段规律推送
  preset: "office_hours"               # 工作日三段式（早盘前→午休→收盘复盘），周末增量推

# ===============================================================
# 2. 数据源 - 热榜平台（已剔除娱乐八卦，纯化财经与宏观信息）
# ===============================================================
platforms:
  enabled: true
  api_url: ""
  sources:
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"
    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"

# ===============================================================
# 3. 数据源 - RSS 订阅（隔夜美股与全球科技风向）
# ===============================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1                    # 严格只看24小时内的鲜活资讯

  feeds:
    - id: "yahoo-finance"
      name: "雅虎财经"
      url: "https://finance.yahoo.com/news/rssindex"

    - id: "hacker-news"
      name: "Hacker News (全球科技/AI风向)"
      url: "https://hnrss.org/frontpage"

    - id: "ruanyifeng"
      name: "阮一峰的网络日志"
      url: "http://www.ruanyifeng.com/blog/atom.xml"
      enabled: false

# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "incremental"                  # 增量监控：只推新发酵的题材与消息，拒绝重复刷屏
  display_mode: "keyword"              # 按板块/主题标签分组展示，方便一眼看出题材热度
  sort_by_position_first: true         # 按你关注的板块优先级排序
  rank_threshold: 3                    # 前3名重磅消息高亮显示
  max_news_per_keyword: 10             # 单个板块最多展示10条，保持版面精炼

# ===============================================================
# 4.5 筛选策略（启用AI语义理解，捕捉产业链上下游机会）
# ===============================================================
filter:
  method: "ai"                         # 使用AI智能分类（需配合 config/ai_interests.txt）
  priority_sort_enabled: true          # 按你在 ai_interests.txt 中定义的板块顺序排列

# ===============================================================
# 4.6 AI 智能筛选配置
# ===============================================================
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.65                      # 0.65兼具敏锐度与准确率，防止漏掉早期题材信号
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ===============================================================
# 5. 推送内容控制（结论先行：AI复盘在最顶部）
# ===============================================================
display:
  region_order:
    - ai_analysis                      # 1️⃣ 最顶部：先看 AI 提炼的市场核心逻辑与风口研判
    - new_items                        # 2️⃣ 新增突发热点（盘中异动/新发酵消息）
    - hotlist                          # 3️⃣ 按板块分类的重点资讯
    - standalone                       # 4️⃣ 财联社+华尔街见闻 Top15 全量兜底（防漏重大政策）
    - rss                              # 5️⃣ 外盘与海外科技动态

  regions:
    hotlist: true
    new_items: true                    # 开启新增高亮区域，方便捕捉刚冒头的消息
    rss: true
    standalone: true                   # 开启财联社/华尔街见闻独立全量展示
    ai_analysis: true

  standalone:
    platforms: ["cls-hot", "wallstreetcn-hot"]   # 锁定两大核心金融源全量兜底
    rss_feeds: []
    max_items: 15                                # 每个平台展示前15条核心快讯

# ===============================================================
# 6. 推送通知（⚠️ 请在下方填入你常用的1个推送渠道）
# ===============================================================
notification:
  enabled: true

  channels:
    feishu:
      webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/997431e6-2e5e-4d91-bfe7-f18359ffc5b3"                  # 飞书机器人 webhook URL
    dingtalk:
      webhook_url: ""                  # 钉钉机器人 webhook URL
    wework:
      webhook_url: ""                  # 企业微信机器人 webhook URL
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""                          # iOS 推荐用 Bark，看盘推送最快
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true                         # 生成网页版报告，方便大屏复盘
  local:
    data_dir: "output"
    retention_days: 30                 # 保留30天历史数据，用于回顾月度主线轮动
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

# ===============================================================
# 8. AI 模型配置（⚠️ 请填入你的 API Key）
# ===============================================================
ai:
  model: "deepseek/deepseek-v4-flash"  # 如果用的是官方标准接口且报错，可改为 "deepseek/deepseek-chat" 或 "gemini/gemini-2.5-flash"
  api_key: "sk-865f19d3b2f1475587de75f5fc41870a"                          # 👈 必填：在此填入你的 AI API Key
  api_base: ""
  timeout: 120
  temperature: 0.3                     # 调低至 0.3：让金融分析更严谨客观，减少AI胡思乱想
  max_tokens: 5000
  num_retries: 2
  fallback_models: []

# ===============================================================
# 9. AI 分析功能（全方位纳入外盘与核心财经源）
# ===============================================================
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 150
  include_rss: true                    # 开启：将雅虎财经/海外科技动态一并交给AI做A股映射分析
  include_standalone: true             # 开启：确保财联社与华尔街见闻的全量头条参与AI复盘
  include_rank_timeline: true          # 开启：让AI通过热搜排名变化判断题材是在“升温”还是“退潮”

# ===============================================================
# 10. AI 翻译功能
# ===============================================================
ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: true                          # 自动将雅虎财经和 Hacker News 英文标题翻译为中文
    standalone: false

# ===============================================================
# 11. 高级设置（优化了权重：突发高排位优先）
# ===============================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"

  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""

  # 排序权重调整：提高排名与热度权重，确保突发重磅利好排在最前
  weight:
    rank: 0.65                         # 排名权重
    frequency: 0.20                    # 频次权重
    hotness: 0.15                      # 热度权重

  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
